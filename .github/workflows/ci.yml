name: CI
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,misconfig,secret
          skip-dirs: .git,node_modules,dist,playwright-report,test-results
          severity: HIGH,CRITICAL
          exit-code: '1'
      - uses: actions/setup-python@v5
      - name: Run Bandit when Python sources exist
        shell: bash
        run: |
          if find . -type f -name '*.py' -not -path './.git/*' -not -path './node_modules/*' -print -quit | grep -q .; then
            python -m pip install --disable-pip-version-check bandit
            bandit -r . -x .git,node_modules,dist,playwright-report,test-results
          else
            echo 'No Python sources found; Bandit scan not applicable.'
          fi

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run build

  enforcement:
    runs-on: ubuntu-latest
    environment: staging
    if: ${{ vars.RUN_LIVE_ENFORCEMENT == 'true' }}
    env:
      E2E_RUN_LIVE: 'true'
      E2E_ALLOW_MUTATIONS: 'true'
      E2E_AUTH_EMAIL: ${{ secrets.E2E_AUTH_EMAIL }}
      E2E_AUTH_PASSWORD: ${{ secrets.E2E_AUTH_PASSWORD }}
      E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e:enforcement
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-enforcement-report
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 14